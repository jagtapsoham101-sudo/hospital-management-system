{% extends 'base.html' %}
{% block title %}Edit patient{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>Edit patient</h1></div></div>
<div class="panel-card"><form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ patient.full_name }}" required></div>
<div class="col-md-6"><label class="form-label">Date of birth</label><input class="form-control" type="date" name="date_of_birth" value="{{ patient.date_of_birth.isoformat() }}" required></div>
<div class="col-md-6"><label class="form-label">Gender</label><select class="form-select" name="gender">{% for x in GENDERS|default(['Female','Male','Non-binary','Prefer not to say']) %}<option {% if patient.gender == x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ patient.phone }}" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ patient.email or '' }}"></div>
<div class="col-md-6"><label class="form-label">Blood group</label><input class="form-control" name="blood_group" value="{{ patient.blood_group or '' }}"></div>
<div class="col-12"><label class="form-label">Address</label><input class="form-control" name="address" value="{{ patient.address or '' }}"></div>
</div><div class="mt-3 d-flex gap-2"><button class="btn btn-primary-custom">Save changes</button><a class="btn btn-light" href="{{ url_for('patients') }}">Cancel</a></div>
</form></div>
{% endblock %}
