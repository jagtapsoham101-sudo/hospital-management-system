{% extends 'base.html' %}{% block title %}Edit admission{% endblock %}{% block content %}<div class="page-heading"><h1>Edit admission</h1></div><div class="panel-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Patient</label><select class="form-select mb-2" name="patient_id">{% for p in patients %}<option value="{{ p.id }}" {% if p.id == item.patient_id %}selected{% endif %}>{{ p.full_name }}</option>{% endfor %}</select><label class="form-label">Bed</label><select class="form-select mb-2" name="bed_id">{% for b in beds %}<option value="{{ b.id }}" {% if b.id == item.bed_id %}selected{% endif %}>{{ b.ward.name }} / {{ b.bed_number }}</option>{% endfor %}</select><label class="form-label">Reason</label><input class="form-control mb-2" name="reason" value="{{ item.reason }}" required><label class="form-label">Status</label><select class="form-select" name="status">{% for s in statuses %}<option {% if s == item.status %}selected{% endif %}>{{ s }}</option>{% endfor %}</select><button class="btn btn-primary-custom mt-3">Save changes</button> <a class="btn btn-light mt-3" href="{{ url_for('admissions') }}">Cancel</a></form></div>{% endblock %}
