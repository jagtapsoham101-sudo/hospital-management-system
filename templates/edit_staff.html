{% extends 'base.html' %}{% block title %}Edit staff{% endblock %}{% block content %}<div class="page-heading"><h1>Edit staff account</h1></div><div class="panel-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p><strong>{{ item.username }}</strong></p><label class="form-label">Role</label><select class="form-select mb-2" name="role">{% for role in ['admin','clinician','reception','billing'] %}<option value="{{ role }}" {% if item.role == role %}selected{% endif %}>{{ role|capitalize }}</option>{% endfor %}</select><label class="form-label">Status</label><select class="form-select mb-2" name="active"><option value="true" {% if item.active %}selected{% endif %}>Active</option><option value="false" {% if not item.active %}selected{% endif %}>Disabled</option></select><label class="form-label">New password (optional, 12+ characters)</label><input class="form-control" type="password" name="password" minlength="12"><button class="btn btn-primary-custom mt-3">Save changes</button> <a class="btn btn-light mt-3" href="{{ url_for('staff') }}">Cancel</a></form></div>{% endblock %}
