{% extends 'base.html' %}{% block title %}Edit prescription{% endblock %}{% block content %}<div class="page-heading"><h1>Edit prescription</h1></div><div class="panel-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Medication</label><input class="form-control mb-2" name="medication" value="{{ item.medication }}" required><label class="form-label">Dosage</label><input class="form-control mb-2" name="dosage" value="{{ item.dosage }}" required><label class="form-label">Instructions</label><input class="form-control" name="instructions" value="{{ item.instructions }}" required><button class="btn btn-primary-custom mt-3">Save changes</button> <a class="btn btn-light mt-3" href="{{ url_for('records') }}">Cancel</a></form></div>{% endblock %}
