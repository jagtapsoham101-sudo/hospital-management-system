{% extends 'base.html' %}{% block title %}Edit clinical record{% endblock %}{% block content %}<div class="page-heading"><h1>Edit clinical record</h1></div><div class="panel-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Patient</label><select class="form-select mb-2" name="patient_id">{% for p in patients %}<option value="{{ p.id }}" {% if p.id == item.patient_id %}selected{% endif %}>{{ p.full_name }}</option>{% endfor %}</select><label class="form-label">Doctor</label><select class="form-select mb-2" name="doctor_id">{% for d in doctors %}<option value="{{ d.id }}" {% if d.id == item.doctor_id %}selected{% endif %}>{{ d.full_name }}</option>{% endfor %}</select><label class="form-label">Record type</label><input class="form-control mb-2" name="record_type" value="{{ item.record_type }}"><label class="form-label">Diagnosis</label><input class="form-control mb-2" name="diagnosis" value="{{ item.diagnosis }}" required><label class="form-label">Notes</label><textarea class="form-control" name="notes" required>{{ item.notes }}</textarea><button class="btn btn-primary-custom mt-3">Save changes</button> <a class="btn btn-light mt-3" href="{{ url_for('records') }}">Cancel</a></form></div>{% endblock %}
