{% extends 'base.html' %}{% block title %}Edit bed{% endblock %}{% block content %}<div class="page-heading"><h1>Edit bed</h1></div><div class="panel-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Ward</label><select class="form-select mb-2" name="ward_id">{% for w in wards %}<option value="{{ w.id }}" {% if w.id == item.ward_id %}selected{% endif %}>{{ w.name }}</option>{% endfor %}</select><label class="form-label">Bed number</label><input class="form-control mb-2" name="bed_number" value="{{ item.bed_number }}" required><label class="form-label">Bed type</label><select class="form-select" name="bed_type">{% for kind in ['General','Private','ICU'] %}<option {% if item.bed_type == kind %}selected{% endif %}>{{ kind }}</option>{% endfor %}</select><button class="btn btn-primary-custom mt-3">Save changes</button> <a class="btn btn-light mt-3" href="{{ url_for('admissions') }}">Cancel</a></form></div>{% endblock %}
